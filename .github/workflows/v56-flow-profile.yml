name: V56 Flow Fingerprint

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v56-dual-submission
    paths:
      - "swarm/v56_flow_profile.py"
      - ".github/workflows/v56-flow-profile.yml"

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact environment
        run: |
          python -m pip install --upgrade pip
          pip install -e . "kaggle-environments==1.32.7" "kagglehub==1.0.2"
      - name: Profile opponent market flow
        run: python -m swarm.v56_flow_profile --output tmp/v56/V56_FLOW_PROFILE.json --seeds 5603,5623,5641
      - name: Upload profile
        uses: actions/upload-artifact@v4
        with:
          name: v56-flow-profile-${{ github.run_id }}
          path: tmp/v56/V56_FLOW_PROFILE.json
          retention-days: 30
