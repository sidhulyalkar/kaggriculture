name: V53B Activation Funnel

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v53b-activation-funnel
    paths:
      - "submission/hard_flow_agent.py"
      - "submission/market_flow_runtime.py"
      - "submission/predictive_agent.py"
      - "swarm/v53_hard_flow_qualification.py"
      - "tests/test_v53_hard_flow.py"
      - ".github/workflows/v53b-activation-funnel.yml"

jobs:
  exact-engine-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact research environment
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest "kaggle-environments==1.32.7"
      - name: Lock behavior-neutral telemetry contracts
        run: pytest -q tests/test_v53_hard_flow.py tests/test_observation_parity.py
      - name: Run exact-engine activation funnel
        run: |
          python -m swarm.v53_hard_flow_qualification \
            --output tmp/v53b/V53B_ACTIVATION.json \
            --seeds 5301,5311,5323,5333
      - name: Upload activation evidence
        uses: actions/upload-artifact@v4
        with:
          name: v53b-activation-${{ github.run_id }}
          path: tmp/v53b/V53B_ACTIVATION.json
          retention-days: 30
