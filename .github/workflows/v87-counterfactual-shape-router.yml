name: V87 Counterfactual Shape Router
on:
  push:
    branches: ["research/v87-counterfactual-shape-router"]
    paths:
      - "experiments/v87/**"
      - ".github/workflows/v87-counterfactual-shape-router.yml"
  workflow_dispatch:

jobs:
  train-and-gate:
    runs-on: ubuntu-24.04
    env: {PYTHONPATH: .}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      - name: Install exact simulator and learner
        run: |
          pip install -q --upgrade pybind11 numpy setuptools wheel
          pip install -q scikit-learn
          pip install -q 'kagsim @ git+https://github.com/destbreso/kaggriculture-cppsim@main'

      - name: Pull current Shape family and build exact route experts
        run: |
          python experiments/v82/pull_fresh_opponents.py
          mkdir -p experiments/v87/opponents experiments/v87/results
          cp experiments/v82/fresh_opponents/shape_current.py experiments/v87/current_shape.py
          cp experiments/v82/fresh_opponents/shape_current.py experiments/v87/opponents/shape_current.py
          cp experiments/v82/fresh_opponents/farming_math.py experiments/v87/opponents/farming_math.py
          python experiments/v87/build_route_experts.py
          python -m py_compile experiments/v87/experts/*.py
          sha256sum experiments/v87/current_shape.py

      - name: Build independent opponent lineages
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git clone -q --depth 1 https://github.com/sota1111/erl-kaggriculture /tmp/e
          python experiments/v81/build_farming_clock_v2.py
          cp experiments/v81/generated/v81_farming_clock.py experiments/v87/opponents/v81_clock.py
          cp /tmp/e/opponents/kaggriculture_structured_economic_policy.py experiments/v87/opponents/v58.py
          cp /tmp/e/opponents/40_40_early_floor_39_46_top_10_v48_fast_routes.py experiments/v87/opponents/v48.py
          cp /tmp/e/opponents/v16_rc5_high_score_8c_4s_premium_market_lead.py experiments/v87/opponents/rc5.py
          python experiments/v87/pull_adaptive_v2.py || echo 'Adaptive Route V2 harvest unavailable; continuing with lineage holdouts'
          ls -lh experiments/v87/opponents
          python -m py_compile experiments/v87/opponents/*.py

      - name: Build counterfactual oracle dataset
        run: |
          python experiments/v87/build_oracle_dataset.py \
            --experts experiments/v87/experts \
            --opponents experiments/v87/opponents \
            --seeds 8 --start-seed 170001 --workers 4 \
            --out experiments/v87/results/oracle.jsonl
          wc -l experiments/v87/results/oracle.jsonl

      - name: Train lineage-held-out checkpoint trees
        run: |
          HOLD='shape_current,farming_math'
          if [ -f experiments/v87/opponents/adaptive_v2.py ]; then HOLD="$HOLD,adaptive_v2"; fi
          python experiments/v87/train_router.py \
            --data experiments/v87/results/oracle.jsonl \
            --train-opponents v58,v48,rc5,v81_clock \
            --holdout-opponents "$HOLD" \
            --out experiments/v87/results/router_model.json
          cat experiments/v87/results/router_model.json

      - name: Build self-contained learned router
        run: |
          python experiments/v87/build_router_candidate.py
          python -m py_compile experiments/v87/generated/v87_counterfactual_shape.py

      - name: Exact fresh mixed-field gate
        run: |
          arena=experiments/v87/arena
          rm -rf "$arena"
          mkdir -p "$arena"
          cp experiments/v87/generated/v87_counterfactual_shape.py "$arena/v87_counterfactual_shape.py"
          cp experiments/v87/opponents/shape_current.py "$arena/shape_current.py"
          cp experiments/v87/opponents/farming_math.py "$arena/farming_math.py"
          cp experiments/v87/opponents/v81_clock.py "$arena/v81_clock.py"
          cp experiments/v87/opponents/v58.py "$arena/v58.py"
          cp experiments/v87/opponents/v48.py "$arena/v48.py"
          cp experiments/v87/opponents/rc5.py "$arena/rc5.py"
          if [ -f experiments/v87/opponents/adaptive_v2.py ]; then cp experiments/v87/opponents/adaptive_v2.py "$arena/adaptive_v2.py"; fi
          python experiments/v79/cloud_field_eval.py \
            --arena "$arena" --seeds 6 --start-seed 180001 \
            --workers 4 --modes standard,ladder_real \
            --out experiments/v87/results/field
          cat experiments/v87/results/field/summary.csv

      - name: BT-aware promotion and package
        run: |
          python experiments/v87/promote_and_package.py

      - uses: actions/upload-artifact@v4
        with:
          name: v87-counterfactual-shape-router
          path: |
            experiments/v87/results
            experiments/v87/submission/main.py
            experiments/v87/Kaggriculture_V87_COUNTERFACTUAL_SHAPE_ROUTER.tar.gz
          retention-days: 14
