name: V59 Historical Frontier

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v59-historical-frontier
    paths:
      - "swarm/v59_historical_frontier.py"
      - ".github/workflows/v59-historical-frontier.yml"

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact environment
        run: |
          python -m pip install --upgrade pip
          pip install -e . "kaggle-environments==1.32.7" "kagglehub==1.0.2"
      - name: Qualify historical frontier checkpoints
        run: |
          python -m swarm.v59_historical_frontier \
            --output tmp/v59/V59_RESULT.json \
            --seeds 5901,5917,5939
      - name: Validate packaged candidates
        run: |
          for f in tmp/v59/SUBMISSION_V59_*.tar.gz; do
            python scripts/check_submission.py "$f"
          done
      - name: Upload V59 evidence and candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v59-historical-frontier-${{ github.run_id }}
          path: |
            tmp/v59/V59_RESULT.json
            tmp/v59/SUBMISSION_V59_*.tar.gz
          if-no-files-found: error
          retention-days: 30
