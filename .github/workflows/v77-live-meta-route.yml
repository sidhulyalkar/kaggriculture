name: V77 Live Meta Route Search

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v45-autonomous-swarm-lab
    paths:
      - 'swarm_requests/V77_LIVE_META.json'

permissions:
  contents: read

concurrency:
  group: v77-live-meta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: '1'
      PYGAME_HIDE_SUPPORT_PROMPT: hide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - name: Install official environment and public-data client
        run: pip install -e . 'kagglehub==1.0.2' 'kaggle-environments==1.32.7'
      - name: Run live-meta route distillation
        run: python -m swarm.v77_live_meta_route_search --output-root /tmp/v77-live-meta --days 2 --per-day 8 --max-version 40 --workers 6
      - name: Verify promoted archive
        if: always()
        shell: bash
        run: |
          archive=$(find /tmp/v77-live-meta/submission -maxdepth 1 -name '*.tar.gz' -print -quit 2>/dev/null || true)
          if [ -n "$archive" ]; then
            python scripts/check_submission.py "$archive"
          else
            echo 'No promoted archive; HOLD is a valid research outcome.'
          fi
      - name: Summarize decision
        if: always()
        shell: bash
        run: |
          cat /tmp/v77-live-meta/V77_LIVE_META_SUMMARY.json 2>/dev/null || true
          echo
          find /tmp/v77-live-meta -maxdepth 3 -type f -printf '%P\n' 2>/dev/null | sort | head -200 || true
      - name: Upload V77 evidence and candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v77-live-meta-${{ github.run_id }}
          path: /tmp/v77-live-meta
          if-no-files-found: error
          retention-days: 30
