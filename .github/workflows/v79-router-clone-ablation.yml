name: V79 v58 clone-router ablation

on:
  push:
    branches: [research/v79-fast-sim-search]
    paths: ['.github/workflows/v79-router-clone-ablation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ablate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact engine
        run: |
          pip install -q --upgrade pybind11 numpy setuptools wheel
          pip install -q 'kagsim @ git+https://github.com/destbreso/kaggriculture-cppsim@main'
      - name: Build v58 clock + clone timing variants
        run: |
          git clone -q --depth 1 https://github.com/sota1111/erl-kaggriculture /tmp/e
          git clone -q --depth 1 https://github.com/Unica2804/kaggri_agent /tmp/u
          rm -rf experiments/v79/router_arena experiments/v79/router_mirror experiments/v79/router_artifacts experiments/v79/results/router_*
          mkdir -p experiments/v79/router_arena experiments/v79/router_mirror experiments/v79/router_artifacts experiments/v79/results
          cp /tmp/e/opponents/kaggriculture_structured_economic_policy.py /tmp/base_v58.py
          python - <<'PY'
          from pathlib import Path
          src=Path('/tmp/base_v58.py').read_text()
          specs={'clone312':(312,192),'clone336':(336,216),'clone384':(384,264)}
          for name,(step,streak) in specs.items():
              s=src
              old=('            if step == 360:\n'
                   '                state["clone_selected"] = int(state["mirror_streak"]) >= 240\n'
                   '            if step >= 360 and bool(state.get("clone_selected")):\n')
              new=(f'            if step == {step}:\n'
                   f'                state["clone_selected"] = int(state["mirror_streak"]) >= {streak}\n'
                   f'            if step >= {step} and bool(state.get("clone_selected")):\n')
              if old not in s: raise RuntimeError('clone block not found')
              Path(f'/tmp/{name}.py').write_text(s.replace(old,new,1))
          PY
          cp /tmp/e/opponents/40_40_early_floor_39_46_top_10_v48_fast_routes.py experiments/v79/router_arena/v48.py
          cp /tmp/e/opponents/v16_rc5_high_score_8c_4s_premium_market_lead.py experiments/v79/router_arena/rc5.py
          cp /tmp/u/main.py experiments/v79/router_arena/unica.py
          python experiments/v79/build_wrapped_agent.py /tmp/base_v58.py experiments/v79/router_arena/clock_base.py --name v58
          for n in clone312 clone336 clone384; do
            python experiments/v79/build_wrapped_agent.py /tmp/$n.py experiments/v79/router_arena/$n.py --name v58_$n
          done
          cp experiments/v79/router_arena/clock_base.py experiments/v79/router_mirror/clock_base.py
          cp experiments/v79/router_arena/clone312.py experiments/v79/router_mirror/clone312.py
          cp experiments/v79/router_arena/clone336.py experiments/v79/router_mirror/clone336.py
          cp experiments/v79/router_arena/clone384.py experiments/v79/router_mirror/clone384.py
      - name: Mirror timing screen
        run: |
          python experiments/v79/cloud_field_eval.py --arena experiments/v79/router_mirror \
            --seeds 6 --start-seed 770001 --workers 12 --modes standard \
            --out experiments/v79/results/router_mirror
      - name: Diverse both-mode field
        run: |
          python experiments/v79/cloud_field_eval.py --arena experiments/v79/router_arena \
            --seeds 4 --start-seed 880001 --workers 16 --modes standard,ladder_real \
            --out experiments/v79/results/router_field
      - name: Package candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil,tarfile,hashlib,json
          out=Path('experiments/v79/router_artifacts'); out.mkdir(parents=True,exist_ok=True)
          names=['clock_base','clone312','clone336','clone384']
          manifest={}
          for n in names:
              src=Path('experiments/v79/router_arena')/(n+'.py')
              d=out/n; d.mkdir(exist_ok=True); shutil.copy2(src,d/'main.py')
              tgz=out/(f'Kaggriculture_V79_{n.upper()}.tar.gz')
              with tarfile.open(tgz,'w:gz') as t: t.add(d/'main.py',arcname='main.py')
              manifest[n]={'main_sha256':hashlib.sha256(src.read_bytes()).hexdigest(),'tar_sha256':hashlib.sha256(tgz.read_bytes()).hexdigest()}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
          python -m py_compile experiments/v79/router_artifacts/*/main.py
          cat experiments/v79/results/router_mirror/summary.csv
          cat experiments/v79/results/router_field/summary.csv
          cat experiments/v79/router_artifacts/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: v79-router-clone-ablation
          path: |
            experiments/v79/results/router_mirror
            experiments/v79/results/router_field
            experiments/v79/router_artifacts
          retention-days: 14
