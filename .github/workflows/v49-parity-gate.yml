name: V49 Parity First Gate

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v49-parity-first-redesign
    paths:
      - "swarm/observation_parity.py"
      - "swarm/v49_parity_gate.py"
      - "tests/test_observation_parity.py"
      - ".github/workflows/v49-parity-gate.yml"

jobs:
  parity-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact research environment
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest "kaggle-environments==1.32.7" "kagglehub==1.0.2"
      - name: Unit-test observation parity shim
        run: pytest -q tests/test_observation_parity.py
      - name: Run seat-parity causal benchmark
        run: |
          python -m swarm.v49_parity_gate \
            --output-root tmp/v49-parity \
            --seeds 4901,4919,4931,4951
      - name: Verify packages
        run: |
          python - <<'PY'
          import tarfile
          from pathlib import Path
          for path in sorted(Path('tmp/v49-parity/packages').glob('*.tar.gz')):
              with tarfile.open(path, 'r:gz') as tf:
                  names=[m.name for m in tf.getmembers() if m.isfile()]
                  assert names == ['main.py'], (path, names)
                  src=tf.extractfile(tf.getmember('main.py')).read().decode('utf-8')
                  compile(src, str(path), 'exec')
              print(path)
          PY
      - name: Upload V49 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v49-parity-${{ github.run_id }}
          path: |
            tmp/v49-parity/V49_PARITY_RESULT.json
            tmp/v49-parity/rows.json
            tmp/v49-parity/packages/*.tar.gz
          retention-days: 30
