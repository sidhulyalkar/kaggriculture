name: NVIDIA Swarm Live

on:
  push:
    branches:
      - agent/v45-autonomous-swarm-lab
    paths:
      - 'swarm_requests/ACTIVE.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvidia-swarm-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - name: Install swarm and public-frontier client
        run: pip install -e . 'kagglehub==1.0.2'
      - name: Verify NVIDIA secret is injected
        shell: bash
        run: |
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo 'NVIDIA_API_KEY is not available to this workflow.' >&2
            exit 2
          fi
          echo 'NVIDIA secret injection: present'
      - name: Execute live swarm request
        run: python -m swarm.live_request --request swarm_requests/ACTIVE.json --output-root /tmp/swarm-live
      - name: Summarize result tree
        if: always()
        shell: bash
        run: find /tmp/swarm-live -maxdepth 6 -type f -printf '%P\n' 2>/dev/null | sort | head -400 || true
      - name: Upload live swarm evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-swarm-live-${{ github.run_id }}
          path: /tmp/swarm-live
          if-no-files-found: warn
          retention-days: 30
