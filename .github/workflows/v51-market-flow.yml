name: V51 Market Flow Validation

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v49-parity-first-redesign
    paths:
      - "swarm/market_belief.py"
      - "swarm/v51_market_flow_validation.py"
      - "tests/test_market_belief.py"
      - ".github/workflows/v51-market-flow.yml"

jobs:
  validate-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research environment
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest "kaggle-environments==1.32.7" "kagglehub==1.0.2"
      - name: Test market accounting primitives
        run: pytest -q tests/test_market_belief.py
      - name: Validate against replay-private labels
        run: |
          python -m swarm.v51_market_flow_validation \
            --output-root tmp/v51-market-flow \
            --days 3 \
            --per-day 8
      - name: Upload V51 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v51-market-flow-${{ github.run_id }}
          path: tmp/v51-market-flow/V51_MARKET_FLOW_RESULT.json
          retention-days: 30
