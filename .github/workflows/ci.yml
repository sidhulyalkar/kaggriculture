name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q
      - run: python -m swarm.run_epoch --config swarm/config/default.yaml --dry-run --output-root /tmp/swarm-runs
      - run: test -n "$(find /tmp/swarm-runs -name DRY_RUN_READY.txt -print -quit)"
      - run: python scripts/build_submission.py
      - run: python scripts/check_submission.py artifacts/submission_v2.tar.gz
