name: V89 Continuation mining
on:
  push:
    branches: ["research/v89-continuation-mining"]
    paths:
      - "experiments/v89/**"
      - ".github/workflows/v89-continuation-mining.yml"
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Harvest current public notebooks
        run: |
          python experiments/v89/harvest_public_notebooks.py
          cat experiments/v89/harvest/report.json
          find experiments/v89/harvest -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: v89-public-strategy-harvest
          path: experiments/v89/harvest
          retention-days: 14
