name: V82 capacity allocation

on:
  push:
    branches: ["research/v82-capacity-allocation"]
    paths:
      - "experiments/v82/**"
      - ".github/workflows/v82-capacity-allocation.yml"
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact simulator
        run: |
          pip install -q --upgrade pybind11 numpy setuptools wheel
          pip install -q 'kagsim @ git+https://github.com/destbreso/kaggriculture-cppsim@main'
      - name: Build V81 control and V82 variants
        run: |
          python experiments/v81/build_farming_clock_v2.py
          python experiments/v82/build_capacity_variants.py
          python -m py_compile experiments/v82/generated/*.py
      - name: Pull fresh public opponents
        run: |
          python experiments/v82/pull_fresh_opponents.py
          git config --local --unset-all http.https://github.com/.extraheader || true
          git clone -q --depth 1 https://github.com/sota1111/erl-kaggriculture /tmp/e
      - name: Discovery field
        run: |
          rm -rf experiments/v82/discovery_arena experiments/v82/results
          mkdir -p experiments/v82/discovery_arena experiments/v82/results
          cp experiments/v81/generated/v81_farming_clock.py experiments/v82/discovery_arena/v81_clock.py
          cp experiments/v82/generated/*.py experiments/v82/discovery_arena/
          cp experiments/v82/fresh_opponents/shape_current.py experiments/v82/discovery_arena/shape_current.py
          cp experiments/v82/fresh_opponents/farming_math.py experiments/v82/discovery_arena/farming_math.py
          cp /tmp/e/opponents/kaggriculture_structured_economic_policy.py experiments/v82/discovery_arena/v58.py
          python experiments/v79/cloud_field_eval.py \
            --arena experiments/v82/discovery_arena --seeds 3 --start-seed 102001 \
            --workers 4 --modes standard,ladder_real --out experiments/v82/results/discovery
          cat experiments/v82/results/discovery/summary.csv
      - name: Select best V82 and build independent holdout
        run: |
          python - <<'PY'
          import json, pathlib, shutil
          root=pathlib.Path('experiments/v82')
          data=json.loads((root/'results/discovery/field_results.json').read_text())
          candidates=[n for n in data['ranking'] if n.startswith('v82_')]
          if not candidates:
              raise SystemExit('no V82 candidates')
          best=candidates[0]
          (root/'results/selected.txt').write_text(best+'\n')
          arena=root/'holdout_arena'; arena.mkdir(parents=True,exist_ok=True)
          shutil.copy(root/'generated'/f'{best}.py', arena/f'{best}.py')
          shutil.copy('experiments/v81/generated/v81_farming_clock.py', arena/'v81_clock.py')
          shutil.copy(root/'fresh_opponents/shape_current.py', arena/'shape_current.py')
          shutil.copy(root/'fresh_opponents/farming_math.py', arena/'farming_math.py')
          shutil.copy('/tmp/e/opponents/kaggriculture_structured_economic_policy.py', arena/'v58.py')
          shutil.copy('/tmp/e/opponents/40_40_early_floor_39_46_top_10_v48_fast_routes.py', arena/'v48.py')
          print('SELECTED',best)
          PY
          python experiments/v79/cloud_field_eval.py \
            --arena experiments/v82/holdout_arena --seeds 5 --start-seed 112001 \
            --workers 4 --modes standard,ladder_real --out experiments/v82/results/holdout
          cat experiments/v82/results/holdout/summary.csv
      - name: Promotion gate and package
        run: |
          python - <<'PY'
          import json, pathlib, shutil, tarfile, hashlib
          root=pathlib.Path('experiments/v82')
          selected=(root/'results/selected.txt').read_text().strip()
          d=json.loads((root/'results/holdout/field_results.json').read_text())['summary']
          cand=d[selected]; base=d['v81_clock']
          decision = (
              cand['errors']==0 and
              cand['win_rate'] >= base['win_rate'] + 0.015 and
              cand['robust_score'] >= base['robust_score'] + 0.01 and
              cand['margin_cvar10'] >= base['margin_cvar10'] - 2500
          )
          report={'selected':selected,'candidate':cand,'base':base,'promote':decision}
          (root/'results/promotion.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          sub=root/'submission'; sub.mkdir(parents=True,exist_ok=True)
          shutil.copy(root/'generated'/f'{selected}.py', sub/'main.py')
          tar=root/f'Kaggriculture_V82_{selected.upper()}.tar.gz'
          with tarfile.open(tar,'w:gz') as tf: tf.add(sub/'main.py',arcname='main.py')
          print('MAIN_SHA',hashlib.sha256((sub/'main.py').read_bytes()).hexdigest())
          print('TAR_SHA',hashlib.sha256(tar.read_bytes()).hexdigest())
          print('PROMOTE',decision)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v82-capacity-allocation
          path: |
            experiments/v82/results
            experiments/v82/generated
            experiments/v82/submission/main.py
            experiments/v82/Kaggriculture_V82_*.tar.gz
          retention-days: 14
