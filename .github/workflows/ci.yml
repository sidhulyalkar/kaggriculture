name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q
      - run: python scripts/build_submission.py
      - run: python scripts/check_submission.py artifacts/submission_v2.tar.gz
      - run: python scripts/build_v33_workgraph_submission.py --dev-base-source submission/base_controller.py
      - run: python scripts/evaluate_v33_workgraph.py --dev-base-source submission/base_controller.py --seeds 16 --out artifacts/v33_dev_direct.json
