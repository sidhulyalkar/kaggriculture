name: V53 Hard Flow Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v53-hard-flow-response
    paths:
      - "submission/hard_flow_agent.py"
      - "submission/market_flow_runtime.py"
      - "submission/predictive_agent.py"
      - "swarm/v53_hard_flow_qualification.py"
      - "tests/test_v53_hard_flow.py"
      - ".github/workflows/v53-hard-flow-qualification.yml"

jobs:
  exact-engine-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact research environment
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest "kaggle-environments==1.32.7"
      - name: Lock V53 unit contracts
        run: pytest -q tests/test_v53_hard_flow.py tests/test_observation_parity.py
      - name: Run exact-engine paired development gate
        run: |
          python -m swarm.v53_hard_flow_qualification \
            --output tmp/v53/V53_QUALIFICATION.json \
            --seeds 5301,5311,5323,5333
      - name: Upload exact-engine evidence
        uses: actions/upload-artifact@v4
        with:
          name: v53-hard-flow-${{ github.run_id }}
          path: tmp/v53/V53_QUALIFICATION.json
          retention-days: 30
